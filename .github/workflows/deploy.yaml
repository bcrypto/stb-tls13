name: deploy

on:
  push:
    tags:
      - draft-*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache setup
      id: cache-setup
      run: |
        mkdir -p "$HOME"/.cache/xml2rfc
        echo "path=$HOME/.cache/xml2rfc" >> $GITHUB_OUTPUT
        echo "date=$(date -u '+%FT%T')" >> $GITHUB_OUTPUT
    - name: Cache references
      uses: actions/cache@v5
      with:
        path: ${{ steps.cache-setup.outputs.path }}
        key: refcache-${{ steps.cache-setup.outputs.date }}
        restore-keys: |
          refcache-${{ steps.cache-setup.outputs.date }}
          refcache-
    - name: Assemble draft
      run: |
          awk 'FNR==1 && NR!=1 {printf "\n"} 1' src/*.md > draft-stb-tls13.md
          cp -f scripts/makefile .
    - name: Build draft
      uses: martinthomson/i-d-template@v1
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: stb-tls13
        path: draft-stb-tls13.*
        retention-days: 3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v5
      with:
        name: stb-tls13
    - name: Display structure of downloaded files
      run: ls -r
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: |
          draft-stb-tls13.md
          draft-stb-tls13.html
          draft-stb-tls13.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
